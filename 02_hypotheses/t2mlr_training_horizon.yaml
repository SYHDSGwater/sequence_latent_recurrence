belief:
  prior: moderate
  current: moderate
  update_rule: >-
    只有 controlled training 中 temporal horizon 对 persistence 的因果影响才提升到 strong；
    frozen-checkpoint cross-scale pattern 仅作相关性证据。

notes: >-
  不把“Jacobi forward approximation”与“short recurrent credit horizon”混为一谈；
  两者必须通过 matched contrasts 分开识别。
  六 checkpoint NLL 矩阵与 state/KL AUC、持续阈值恢复测量均已完成；后者采用
  两个固定方向的 5% 保范数小扰动，恢复不是强制拟合的指数 half-life。
  362M/50B 数学自然 reset 远期未通过 ±0.01 小效应判据，clean-KV 仍很小；
  不能把共有 (16,4) 配置直接解释为所有 checkpoint 的共同恢复尺度。
  零重置 state t50 中位数均为 1 步，但自然 t10 为 5-20 步、clean-KV 为 2-3 步；
  362M/50B 数学的自然路径例外在同数据重测中保留，不能当作独立确认。
  固定 16 样本/领域的同 batch 精度对照中，小扰动自然 state AUC 在 FP32 下缩小
  8.8-17.4 倍，t10 中位数为自然 4-9、clean 2-3 步。BF16 长尾不能直接当作
  语义记忆；FP32 自然路径仍有更小残留，亦不能宣布所有状态信息消失。
  训练尚未执行，当前不据此提升该因果假说的置信度。
