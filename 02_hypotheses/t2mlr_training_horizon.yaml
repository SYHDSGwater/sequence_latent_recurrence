  current: moderate
  update_rule: >-
    只有 controlled training 中 temporal horizon 对 persistence 的因果影响才提升到 strong；
    frozen-checkpoint cross-scale pattern 仅作相关性证据。

notes: >-
  不把“Jacobi forward approximation”与“short recurrent credit horizon”混为一谈；
  两者必须通过 matched contrasts 分开识别。
